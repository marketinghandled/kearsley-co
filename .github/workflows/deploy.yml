name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ssg

      - name: Diagnose SFTP remote directory
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y sshpass >/dev/null
          echo "pwd" > sftp_batch.txt
          echo "ls -la" >> sftp_batch.txt
          sshpass -p "${{ secrets.IONOS_FTP_PASSWORD }}" sftp -oBatchMode=no -oStrictHostKeyChecking=no -b sftp_batch.txt "${{ secrets.IONOS_FTP_USERNAME }}@${{ secrets.IONOS_FTP_SERVER }}"

      - name: Deploy to IONOS via SFTP
        uses: Dylan700/sftp-upload-action@v1.2.4
        with:
          server: ${{ secrets.IONOS_FTP_SERVER }}
          port: 22
          username: ${{ secrets.IONOS_FTP_USERNAME }}
          password: ${{ secrets.IONOS_FTP_PASSWORD }}
          uploads: |
            ./dist/ => ./
          delete: false
