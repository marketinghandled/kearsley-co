name: Deploy to IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ssg

      - name: Deploy to IONOS via SFTP
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y lftp >/dev/null
          lftp -u "${{ secrets.IONOS_FTP_USERNAME }}","${{ secrets.IONOS_FTP_PASSWORD }}" sftp://${{ secrets.IONOS_FTP_SERVER }} -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose dist/ ./; bye"
